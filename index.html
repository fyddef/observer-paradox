<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Вечности :: Инициализация</title>
    <style>
        :root {
            --bg: #07070a;
            --primary: #d4af37;
            --secondary: #00f0ff;
            --text: #e0e0e0;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(212, 175, 55, 0.3);
        }

        .glitch-mode {
            --bg: #120000;
            --primary: #ff003c;
            --secondary: #ff00ff;
            --text: #ffffff;
            --card-bg: rgba(255, 0, 60, 0.05);
            --border: rgba(255, 0, 60, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background-color 0.5s;
            position: relative;
        }

        /* Фоновая сетка */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        /* Эффект сканлайнов */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 1000px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .status {
            color: var(--secondary);
            font-size: 0.9rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        #narrative {
            font-size: 1.2rem;
            line-height: 1.6;
            min-height: 60px;
            margin-bottom: 40px;
            color: var(--text);
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .card:hover::before { left: 100%; }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .glitch-mode .card:hover {
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.3);
            border-color: var(--primary);
        }

        .card h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .card p {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px 40px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 20px var(--primary);
        }

        /* Анимации */
        .fade-in { animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .glitch-text {
            position: relative;
            animation: glitch-anim 0.3s infinite;
        }
        @keyframes glitch-anim {
            0% { clip-path: inset(40% 0 61% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(92% 0 1% 0); transform: translate(1px, -1px); }
            40% { clip-path: inset(43% 0 1% 0); transform: translate(-1px, 2px); }
            60% { clip-path: inset(25% 0 58% 0); transform: translate(2px, 1px); }
            80% { clip-path: inset(54% 0 7% 0); transform: translate(-1px, -1px); }
            100% { clip-path: inset(58% 0 43% 0); transform: translate(0px); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="intro-screen">
            <h1>АРХИВ ВЕЧНОСТИ</h1>
            <p class="status">[СИСТЕМА]: Ожидание подключения оператора...</p>
            <p id="intro-text" style="margin-bottom: 20px; font-size: 1.1rem;">Вы — Хранитель timelines. Ваша задача — находить объекты, выпадающие из исторической хронологии, и удалять их.</p>
            <button class="btn" id="start-btn">Инициализировать сканер</button>
        </div>

        <div id="game-screen" class="hidden">
            <h1 id="phase-title">ФАЗА 1: ДРЕВНОСТЬ И НОВОЕ ВРЕМЯ</h1>
            <p class="status" id="system-msg">[СКАНЕР]: Обнаружены темпоральные сигнатуры. Выберите аномалию.</p>
            <div id="narrative"></div>
            <div class="cards" id="cards-container"></div>
        </div>

        <div id="end-screen" class="hidden">
            <h1 class="glitch-text" style="color: var(--primary);">ОШИБКА РЕАЛЬНОСТИ</h1>
            <div id="end-text" style="font-size: 1.2rem; line-height: 1.8; margin-top: 30px;"></div>
            <button class="btn" id="reset-btn" style="margin-top: 40px;">Перезагрузить симуляцию</button>
        </div>
    </div>

    <script>
        // --- АУДИО СИСТЕМА (Процедурный звук) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playGlitch() {
            if (!audioCtx) return;
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    playTone(Math.random() * 100 + 50, 'sawtooth', 0.1, 0.2);
                }, i * 50);
            }
        }

        // --- ИГРОВАЯ ЛОГИКА ---
        const narrativeEl = document.getElementById('narrative');
        const cardsContainer = document.getElementById('cards-container');
        const gameScreen = document.getElementById('game-screen');
        const introScreen = document.getElementById('intro-screen');
        const endScreen = document.getElementById('end-screen');

        async function typeText(element, text, speed = 30) {
            element.innerText = "";
            for (let char of text) {
                element.innerText += char;
                if (char !== ' ') playTone(800 + Math.random() * 400, 'sine', 0.02, 0.02);
                await new Promise(r => setTimeout(r, speed));
            }
        }

        function renderCards(cards, phase) {
            cardsContainer.innerHTML = '';
            cards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card fade-in';
                div.style.animationDelay = `${index * 0.2}s`;
                div.innerHTML = `<h3>${card.title}</h3><p>${card.desc}</p>`;
                div.onclick = () => handleChoice(card, phase);
                cardsContainer.appendChild(div);
            });
        }

        async function handleChoice(card, phase) {
            playTone(300, 'triangle', 0.2, 0.1);
            
            if (phase === 1) {
                if (card.anomaly) {
                    await typeText(narrative, "Сканер подтверждает: Нейро-кристалл из 2077 года. Но подождите... сигнатура ДНК на кристалле совпадает с вашей. Это не аномалия истории. Это аномалия вас.", 40);
                    setTimeout(triggerGlitch, 2000);
                } else {
                    await typeText(narrative, "Объект стабилен. Это часть базовой хронологии. Ищите то, чего не должно быть.", 30);
                }
            } else if (phase === 2) {
                if (card.anomaly) {
                    playGlitch();
                    gameScreen.classList.add('hidden');
                    endScreen.classList.remove('hidden');
                    endScreen.classList.add('fade-in');
                    await typeText(document.getElementById('end-text'), 
                        "Вы выбрали устройство из 15 ноября 2026 года. Прямо сейчас. Вы читаете этот текст.\n\nИстория — это не прошлое. Это симуляция, которая обновляется в реальном времени. И вы только что нашли брешь в коде.\n\nДобро пожаловать в реальный мир, Наблюдатель.", 50);
                } else {
                    await typeText(narrative, "Нет. Вы игнорируете очевидное. Посмотрите на дату на вашем устройстве.", 30);
                }
            }
        }

        function triggerGlitch() {
            playGlitch();
            document.body.classList.add('glitch-mode', 'shake');
            document.getElementById('phase-title').innerText = "ФАЗА 2: РАЗЛОМ РЕАЛЬНОСТИ";
            document.getElementById('phase-title').classList.add('glitch-text');
            
            setTimeout(() => {
                document.body.classList.remove('shake');
                narrativeEl.innerText = "";
                
                const phase2Cards = [
                    { title: "Розеттский камень", desc: "196 год до н.э. Ключ к египетским иероглифам.", anomaly: false },
                    { title: "Чертежи да Винчи", desc: "1490 год. Прообраз вертолета и танка.", anomaly: false },
                    { title: "Ваш смартфон", desc: "15 ноября 2026 года. Воскресенье. Вы держите его в руках прямо сейчас.", anomaly: true }
                ];
                
                renderCards(phase2Cards, 2);
                typeText(narrative, "Система повреждена. Хронология рушится. Один из этих объектов находится в вашей комнате прямо сейчас. Найдите его.", 40);
            }, 1500);
        }

        // --- СТАРТ ---
        document.getElementById('start-btn').onclick = () => {
            initAudio();
            playTone(150, 'sawtooth', 0.5, 0.1);
            introScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('fade-in');

            const phase1Cards = [
                { title: "Меч Наполеона", desc: "1812 год. Следы пороха и крови на гарде.", anomaly: false },
                { title: "Свитки Мертвого моря", desc: "II век до н.э. Тайные тексты ессеев.", anomaly: false },
                { title: "Нейро-кристалл", desc: "2077 год. Хранилище памяти искусственного интеллекта.", anomaly: true }
            ];

            renderCards(phase1Cards, 1);
            typeText(narrative, "Добро пожаловать, Хранитель. Перед вами три объекта. Два из них надежно закреплены в истории. Третий — ошибка матрицы времени. Удалите аномалию.", 40);
        };

        document.getElementById('reset-btn').onclick = () => {
            location.reload();
        };
    </script>
</body>
</html>
